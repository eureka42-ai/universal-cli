name: Desktop packages
on:
  push:
    branches: ['fix/windows-agents-and-usability']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            label: windows
          - os: macos-latest
            bundles: app,dmg
            label: macos-arm64
          - os: ubuntu-22.04
            bundles: deb,appimage
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm test
      - name: Build desktop packages
        shell: bash
        run: |
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > bundle-config.json
          npm run tauri -- build --bundles ${{ matrix.bundles }} --config bundle-config.json
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/Eureka42.app Eureka42-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eureka42-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            Eureka42-macos-arm64.zip
